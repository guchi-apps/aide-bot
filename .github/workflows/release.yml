name: Release

# 手動タグpush用のフォールバック。
# GITHUB_TOKENによるタグpush（deploy.ymlのtagジョブ）は他のworkflowを起動しないため、
# 通常のmainマージ→デプロイではdeploy.yml内のreleaseジョブがGitHub Releaseを作成する。
# `git tag v0.2.0 && git push origin v0.2.0` のように人がタグを手動pushしたときだけ
# このworkflowが動く。

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: always()

    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: aide-bot
          NOTIFY_KIND: リリース
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/signaly-notify.sh
